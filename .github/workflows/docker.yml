name: Build, Push and Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_PREFIX: shriza1991

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - context: ./gateway
            image: deployguard-gateway

          - context: ./aggregator
            image: deployguard-aggregator

          - context: ./repository-context-service
            image: deployguard-repository-context

          - context: ./agent-code-risk
            image: deployguard-agent-code-risk

          - context: ./agent-infra-risk
            image: deployguard-agent-infra-risk

          - context: ./agent-incident-history
            image: deployguard-agent-incident-history

          - context: ./frontend
            image: deployguard-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/DeployGuard

            git pull

            docker compose pull

            docker compose up -d

            until curl -sf http://localhost:8003/readiness > /dev/null; do
            echo "Waiting for repository-context-service..."
            sleep 2
            done



            curl -X POST http://localhost:8003/repository/index \
            -H "Content-Type: application/json" \
            -d '{
            "repository_url":"https://github.com/shriza1991/DeployGuard.git",
            "branch":"main"
            }'

            docker image prune -af
