name: Build and Push Docker Images

on:
  push:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: shriza1991

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: gateway
            context: ./gateway
            image: deployguard-gateway

          - service: aggregator
            context: ./aggregator
            image: deployguard-aggregator

          - service: repository-context
            context: ./repository-context-service
            image: deployguard-repository-context

          - service: code-risk
            context: ./agent-code-risk
            image: deployguard-agent-code-risk

          - service: infra-risk
            context: ./agent-infra-risk
            image: deployguard-agent-infra-risk

          - service: incident-history
            context: ./agent-incident-history
            image: deployguard-agent-incident-history

          - service: frontend
            context: ./frontend
            image: deployguard-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
